name: Round 4 replay

# Round 4 is a demonstration and reproducibility round. This workflow is the
# clean machine a judge would use: it proves the engine is the frozen Round 3
# artifact, replays REPLAY_IT_Professionals.txt's no-agent path, and runs the
# unchanged engine against real sites to check that it generalises.
#
# It never modifies the marketplace. Every audit runs from a fresh unzip of
# submission.zip, whose SHA-256 is pinned in round4/SUBMITTED_ZIP.sha256.

on:
  push:
    branches: [sub_final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The checked-in golden reports record the interpreter version, so the
      # byte-for-byte comparison is exact on 3.11.15 and nowhere else.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: The engine is the pinned Round 3 artifact, byte for byte
        run: python round4/tools/check_engine_frozen.py

      - name: The engine's own suites pass from a fresh unzip of submission.zip
        run: |
          mkdir -p "$RUNNER_TEMP/engine" && cd "$RUNNER_TEMP/engine"
          python -m zipfile -e "$GITHUB_WORKSPACE/submission.zip" .
          python tests/validate_marketplace.py | tail -1
          python tests/run_offline.py | tail -1
          for t in tests/test_*.py; do python "$t" | tail -1; done

  replay-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: REPLAY_IT_Professionals.txt parses and its fallback path replays
        if: hashFiles('round4/REPLAY_IT_Professionals.txt') != ''
        run: python round4/tools/verify_replay.py round4/REPLAY_IT_Professionals.txt --evidence 4

  url-list:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.read.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          lines = open("round4/urls/generalization.txt", encoding="utf-8").read().splitlines()
          urls = [l.split("#", 1)[0].strip() for l in lines if l.split("#", 1)[0].strip()]
          print("urls=" + json.dumps(urls))
          PY

  generalization:
    needs: url-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        url: ${{ fromJSON(needs.url-list.outputs.urls) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - id: slug
        run: echo "slug=$(printf '%s' '${{ matrix.url }}' | sed -E 's#^https?://##; s#[^A-Za-z0-9]+#_#g; s#_+$##')" >> "$GITHUB_OUTPUT"
      - name: Audit ${{ matrix.url }} with the unchanged engine
        run: python round4/tools/live_matrix.py "${{ matrix.url }}" --out runs --evidence 8 --json runs/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ steps.slug.outputs.slug }}
          path: runs/
          if-no-files-found: warn
          retention-days: 30
